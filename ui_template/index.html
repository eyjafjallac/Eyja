<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyja UI Design System & Phase 1–4 Interactive Blueprint Hub</title>
  <link rel="stylesheet" href="./design-system.css" />
  <style>
    .hub-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .hub-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2f5fe3, #1d3fae);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 18px;
    }

    .screen-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-sidebar);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .switch-btn {
      border: 0;
      background: transparent;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .switch-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-xs);
    }

    .preview-frame-wrap {
      height: calc(100vh - 58px);
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header class="hub-header">
    <div class="hub-brand">
      <div class="brand-mark">E</div>
      <div>
        <strong style="font-size:14.5px;">Eyja UI Blueprint Studio</strong>
        <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">Phase 1 → Phase 4 Full Picture</span>
      </div>
    </div>

    <nav class="screen-switcher" aria-label="Prototype views">
      <button class="switch-btn active" onclick="loadScreen('./phase1-editor.html', this)">
        1. Phase 1: Split Editor &amp; Timeline
      </button>
      <button class="switch-btn" onclick="loadScreen('./phase1-library.html', this)">
        2. Phase 1: Home Library &amp; Widgets
      </button>
      <button class="switch-btn" onclick="loadScreen('./phase1-memo.html', this)">
        3. Phase 1: Floating Quick Memo
      </button>
      <button class="switch-btn" onclick="loadScreen('./phase2-3-4-roadmap.html', this)">
        4. Phase 2–4: Import, LaTeX, Agent &amp; Graph
      </button>
    </nav>

    <div style="display:flex; gap:8px;">
      <a id="open-direct" class="btn" href="./phase1-editor.html" target="_blank" style="text-decoration:none;">
        Open Screen in Full Tab ↗
      </a>
    </div>
  </header>

  <div class="preview-frame-wrap">
    <iframe id="stage-frame" src="./phase1-editor.html" title="Eyja UI Prototype"></iframe>
  </div>

  <script>
    function loadScreen(url, btn) {
      document.getElementById("stage-frame").src = url;
      document.getElementById("open-direct").href = url;
      document.querySelectorAll(".switch-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    }
  </script>
</body>
</html>
